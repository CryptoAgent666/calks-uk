<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 32 32">
  <!-- PWA maskable icon + apple-touch-icon source. Full-bleed navy (Android/iOS apply their own
       mask), calculator glyph from favicon.svg scaled to 70% so its corners stay inside the
       maskable safe zone (circle, radius 40% of the icon). Rendered with rsvg-convert to
       public/icons/icon-maskable-{192,512}-<hash>.png and public/apple-touch-icon.png (180).
       /icons/* is served immutable, so a changed PNG needs a new hash in its name. -->
  <rect width="32" height="32" fill="#1e3a5f"/>
  <g transform="translate(16 16) scale(0.7) translate(-16 -16)">
    <rect x="6" y="3" width="20" height="26" rx="3" fill="none" stroke="white" stroke-width="1.5"/>
    <line x1="9" y1="8" x2="23" y2="8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="11" cy="14" r="1.2" fill="white"/>
    <circle cx="16" cy="14" r="1.2" fill="white"/>
    <circle cx="21" cy="14" r="1.2" fill="white"/>
    <circle cx="11" cy="19" r="1.2" fill="white"/>
    <circle cx="16" cy="19" r="1.2" fill="white"/>
    <circle cx="21" cy="19" r="1.2" fill="white"/>
    <circle cx="11" cy="24" r="1.2" fill="white"/>
    <circle cx="16" cy="24" r="1.2" fill="white"/>
    <rect x="19" y="18" width="4" height="8" rx="1" fill="white"/>
  </g>
</svg>
